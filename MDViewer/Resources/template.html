<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDViewer</title>
  <style id="custom-style"></style>
</head>
<body>
  <div id="content"></div>

  <script src="marked.min.js"></script>
  <script src="highlight.min.js"></script>
  <script src="hljs-swift.min.js"></script>
  <script>
    // Configure marked
    marked.setOptions({
      breaks: true,
      gfm: true
    });

    // Configure highlight.js
    hljs.configure({ ignoreUnescapedHTML: true });

    // Handle for any in-progress async highlight pass; cancelled when a new
    // render starts so stale passes don't overwrite freshly rendered content.
    var _hljsRafId = null;

    function renderMarkdown(md) {
      // Cancel any previous async highlight pass before replacing innerHTML
      if (_hljsRafId !== null) {
        cancelAnimationFrame(_hljsRafId);
        _hljsRafId = null;
      }

      // Phase 1: parse + insert HTML immediately so content is visible at once
      const html = marked.parse(md);
      document.getElementById('content').innerHTML = html;

      // Phase 2: highlight code blocks asynchronously in batches so the page
      // is readable before all syntax colours are applied (5 blocks per frame
      // balances throughput against UI responsiveness)
      var blocks = Array.from(document.querySelectorAll('pre code'));
      if (blocks.length === 0) return;
      var i = 0;
      function step() {
        var end = Math.min(i + 5, blocks.length);
        while (i < end) { hljs.highlightElement(blocks[i]); i++; }
        _hljsRafId = (i < blocks.length) ? requestAnimationFrame(step) : null;
      }
      _hljsRafId = requestAnimationFrame(step);
    }

    // Synchronous variant used during export — parse + highlight in one shot,
    // no requestAnimationFrame, works in a headless WKWebView.
    function renderMarkdownSync(md) {
      if (_hljsRafId !== null) {
        cancelAnimationFrame(_hljsRafId);
        _hljsRafId = null;
      }
      const html = marked.parse(md);
      document.getElementById('content').innerHTML = html;
      document.querySelectorAll('pre code').forEach(function(block) {
        hljs.highlightElement(block);
      });
    }

    function resetScroll() {
      window.scrollTo(0, 0);
    }

    function scrollToEditorText(text, editorFraction, lineFraction) {
      if (!text || text.length < 2) {
        // No searchable text — fall back to line fraction if available
        if (typeof lineFraction === 'number' && !isNaN(lineFraction)) {
          scrollToFraction(lineFraction);
        }
        return;
      }
      // Fall back to 0 if the fraction is missing or invalid
      if (typeof editorFraction !== 'number' || isNaN(editorFraction)) {
        editorFraction = 0;
      }
      if (typeof lineFraction !== 'number' || isNaN(lineFraction)) {
        lineFraction = -1;  // sentinel: not available
      }
      var content = document.getElementById('content');
      if (!content) return;
      var blockTags = ['H1','H2','H3','H4','H5','H6','P','LI','BLOCKQUOTE','PRE','TD','DT','DD'];

      // Collect ALL matching block-level elements
      var matches = [];
      var walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, null);
      var node;
      var seen = new Set();  // avoid duplicate block elements
      while ((node = walker.nextNode())) {
        if (node.textContent.includes(text)) {
          var el = node.parentElement;
          while (el && !blockTags.includes(el.tagName)) { el = el.parentElement; }
          var target = el || node.parentElement;
          // Deduplicate: same block element may contain the text in multiple text nodes
          if (!seen.has(target)) {
            seen.add(target);
            matches.push(target);
          }
        }
      }

      if (matches.length === 0) {
        // No text match found — fall back to line fraction
        if (lineFraction >= 0) {
          scrollToFraction(lineFraction);
        }
        return;
      }

      // If only one match, use it directly
      var target;
      if (matches.length === 1) {
        target = matches[0];
      } else {
        // Multiple matches: pick the one whose document-position fraction is closest to lineFraction
        if (lineFraction >= 0) {
          var docHeight = document.documentElement.scrollHeight;
          var bestDist = Infinity;
          target = matches[0];
          for (var i = 0; i < matches.length; i++) {
            var elemTop = matches[i].getBoundingClientRect().top + window.scrollY;
            var elemFraction = docHeight > 0 ? elemTop / docHeight : 0;
            var dist = Math.abs(elemFraction - lineFraction);
            if (dist < bestDist) {
              bestDist = dist;
              target = matches[i];
            }
          }
        } else {
          target = matches[0];
        }
      }

      // Position the element at the same proportional vertical position as the cursor in the editor
      var elementTop = target.getBoundingClientRect().top + window.scrollY;
      var scrollTarget = Math.max(0, elementTop - editorFraction * window.innerHeight);
      window.scrollTo({ top: scrollTarget, behavior: 'instant' });
    }

    function scrollToFraction(fraction) {
      var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (maxScroll > 0) {
        window.scrollTo({ top: maxScroll * fraction, behavior: 'instant' });
      }
    }

    function scrollToHeading(index) {
      const headings = document.querySelectorAll('h1, h2, h3, h4, h5, h6');
      if (headings[index]) {
        headings[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function scrollToHeadingWithFraction(headingIndex, sectionFraction, editorFraction) {
      var headings = document.querySelectorAll('h1, h2, h3, h4, h5, h6');
      var docHeight = document.documentElement.scrollHeight;

      // Clamp fractions
      if (typeof sectionFraction !== 'number' || isNaN(sectionFraction)) sectionFraction = 0;
      if (typeof editorFraction !== 'number' || isNaN(editorFraction)) editorFraction = 0;
      sectionFraction = Math.max(0, Math.min(1, sectionFraction));
      editorFraction = Math.max(0, Math.min(1, editorFraction));

      var sectionTop, sectionBottom;

      if (headingIndex < 0) {
        // Cursor is before the first heading: section is from document top to first heading
        sectionTop = 0;
        if (headings.length > 0) {
          sectionBottom = headings[0].getBoundingClientRect().top + window.scrollY;
        } else {
          sectionBottom = docHeight;
        }
      } else if (headingIndex >= headings.length) {
        // Out of range — fall back to fraction scroll
        scrollToFraction(sectionFraction);
        return;
      } else {
        // Normal case: section from this heading to the next (or end of document)
        sectionTop = headings[headingIndex].getBoundingClientRect().top + window.scrollY;
        if (headingIndex + 1 < headings.length) {
          sectionBottom = headings[headingIndex + 1].getBoundingClientRect().top + window.scrollY;
        } else {
          sectionBottom = docHeight;
        }
      }

      var sectionHeight = sectionBottom - sectionTop;
      var targetY = sectionTop + sectionFraction * sectionHeight;

      // Position so the target line appears at editorFraction of the viewport
      var scrollTarget = Math.max(0, targetY - editorFraction * window.innerHeight);
      window.scrollTo({ top: scrollTarget, behavior: 'instant' });
    }

    function applyCustomStyle(cssText) {
      document.getElementById('custom-style').textContent = cssText;
    }

    function applyMobileCSS(cssText) {
      var el = document.getElementById('mobile-style');
      if (!el) {
        el = document.createElement('style');
        el.id = 'mobile-style';
        document.head.appendChild(el);
      }
      el.textContent = cssText;
    }

    function removeMobileCSS() {
      var el = document.getElementById('mobile-style');
      if (el) { el.parentNode.removeChild(el); }
    }

    // Intercept clicks on .md / .markdown links and forward to Swift
    document.addEventListener('click', function(e) {
      var link = e.target.closest('a');
      if (!link) return;
      var href = link.getAttribute('href');
      if (!href) return;
      if (/\.(md|markdown)(\?.*)?$/i.test(href)) {
        e.preventDefault();
        e.stopPropagation();
        window.webkit.messageHandlers.openMDLink.postMessage(href);
      }
    });

    // Reverse sync: click in preview → scroll editor to matching position
    document.addEventListener('click', function(e) {
      if (e.target.closest('a')) return; // links handled separately

      var clickFraction = Math.max(0, Math.min(1, e.clientY / window.innerHeight));
      var clickY = e.clientY + window.scrollY;
      var headings = Array.from(document.querySelectorAll(
        '#content h1,#content h2,#content h3,#content h4,#content h5,#content h6'
      ));

      if (headings.length === 0) {
        var docHeight = Math.max(1, document.documentElement.scrollHeight);
        window.webkit.messageHandlers.syncToEditor.postMessage({
          headingIndex: -1,
          sectionFraction: Math.max(0, Math.min(1, clickY / docHeight)),
          clickFraction: clickFraction
        });
        return;
      }

      // Find last heading whose top is at or above the click
      var headingIndex = -1;
      for (var i = 0; i < headings.length; i++) {
        if (headings[i].getBoundingClientRect().top + window.scrollY <= clickY) {
          headingIndex = i;
        }
      }

      var sectionFraction = 0;
      if (headingIndex >= 0) {
        var sectionTop = headings[headingIndex].getBoundingClientRect().top + window.scrollY;
        var sectionBottom = (headingIndex + 1 < headings.length)
          ? headings[headingIndex + 1].getBoundingClientRect().top + window.scrollY
          : document.documentElement.scrollHeight;
        var sh = sectionBottom - sectionTop;
        sectionFraction = sh > 0 ? Math.max(0, Math.min(1, (clickY - sectionTop) / sh)) : 0;
      } else {
        // Click is before the first heading
        var firstTop = headings[0].getBoundingClientRect().top + window.scrollY;
        sectionFraction = firstTop > 0 ? Math.max(0, Math.min(1, clickY / firstTop)) : 0;
      }

      window.webkit.messageHandlers.syncToEditor.postMessage({
        headingIndex: headingIndex,
        sectionFraction: sectionFraction,
        clickFraction: clickFraction
      });
    });
  </script>
</body>
</html>
