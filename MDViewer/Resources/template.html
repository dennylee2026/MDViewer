<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MDViewer</title>
  <link rel="stylesheet" id="hljs-theme" href="hljs-light.css">
  <link rel="stylesheet" id="md-theme" href="">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      padding: 40px 48px;
      max-width: 860px;
      margin: 0 auto;
    }
    @media (max-width: 700px) {
      body { padding: 24px 20px; }
    }
  </style>
</head>
<body>
  <div id="content"></div>

  <script src="marked.min.js"></script>
  <script src="highlight.min.js"></script>
  <script src="hljs-swift.min.js"></script>
  <script>
    // Configure marked
    marked.setOptions({
      breaks: true,
      gfm: true
    });

    // Configure highlight.js
    hljs.configure({ ignoreUnescapedHTML: true });

    function renderMarkdown(md) {
      const html = marked.parse(md);
      document.getElementById('content').innerHTML = html;
      document.querySelectorAll('pre code').forEach(function(block) {
        hljs.highlightElement(block);
      });
      window.scrollTo(0, 0);
    }

    function scrollToEditorText(text) {
      if (!text || text.length < 2) return;
      var content = document.getElementById('content');
      if (!content) return;
      var blockTags = ['H1','H2','H3','H4','H5','H6','P','LI','BLOCKQUOTE','PRE','TD','DT','DD'];
      // Walk all text nodes so inline elements (bold, italic, code) are also searched
      var walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT, null);
      var node;
      while ((node = walker.nextNode())) {
        if (node.textContent.includes(text)) {
          // Bubble up to the nearest block-level ancestor
          var el = node.parentElement;
          while (el && !blockTags.includes(el.tagName)) { el = el.parentElement; }
          (el || node.parentElement).scrollIntoView({ behavior: 'instant', block: 'start' });
          return;
        }
      }
    }

    function scrollToFraction(fraction) {
      var maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      if (maxScroll > 0) {
        window.scrollTo({ top: maxScroll * fraction, behavior: 'instant' });
      }
    }

    function scrollToHeading(index) {
      const headings = document.querySelectorAll('h1, h2, h3, h4, h5, h6');
      if (headings[index]) {
        headings[index].scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }

    function switchTheme(theme) {
      const mdLink = document.getElementById('md-theme');
      const hljsLink = document.getElementById('hljs-theme');
      if (theme === 'dark') {
        mdLink.href = 'dark.css';
        hljsLink.href = 'hljs-dark.css';
        document.body.classList.remove('light');
        document.body.classList.add('dark');
      } else {
        mdLink.href = 'light.css';
        hljsLink.href = 'hljs-light.css';
        document.body.classList.remove('dark');
        document.body.classList.add('light');
      }
    }

    // Initialize with light theme
    switchTheme('light');
  </script>
</body>
</html>
